[tools]
go = "1.26.5"
rust = "1.97.1"
"go:github.com/vladopajic/go-test-coverage/v2" = "v2.18.9"

[vars]
corpus = "https://developer.arm.com/-/cdn-downloads/permalink/Exploration-Tools-A64-ISA/ISA_A64/ISA_A64_xml_A_profile-2026-06.tar.gz"
benchtime = "1s"
benchcount = "1"

[tasks.default]
description = "List repository tasks"
run = "mise tasks ls"

[tasks."fmt:check"]
description = "Require all Go sources to be gofmt-clean"
run = '''
unformatted="$(find cmd pkg tests templates -type f -name '*.go' -exec gofmt -l {} +)"
test -z "$unformatted" || {
  echo "gofmt required:" >&2
  echo "$unformatted" >&2
  exit 1
}
'''

[tasks.vet]
description = "Run Go static analysis"
run = "go vet ./..."

[tasks.test]
description = "Run the deterministic offline test suite"
run = "go test ./... -count=1 -timeout 180s"

[tasks."test:race"]
description = "Run race-sensitive core and conformance packages"
run = "go test -race ./pkg/decoder ./pkg/arm ./pkg/coverage ./tests/conformance"

[tasks."coverage:source"]
description = "Measure source coverage and enforce configured regression floors"
run = '''
mkdir -p .coverage
go test ./... -coverprofile=.coverage/coverage.out -covermode=atomic -coverpkg=./...
go-test-coverage --config=.testcoverage.yml
go test ./pkg/coverage -coverprofile=.coverage/coverage-package.out -covermode=atomic
go-test-coverage --profile=.coverage/coverage-package.out \
  --threshold-file=100 --threshold-package=100 --threshold-total=100
'''

[tasks."coverage:encodings"]
description = "Prove every resolved encoding appears exactly once in Go and Rust exact ledgers"
run = '''
corpus="${CORPUS:-{{vars.corpus}}}"
MKASM_CORPUS="$corpus" MKASM_LEDGER_COVERAGE=1 \
  go test ./tests/conformance \
    -run '^TestGeneratedLedgerEncodingCoverage$' -v -count=1 -timeout 300s
'''

[tasks.verify]
description = "Run formatting, vet, unit, race, source, and encoding-coverage gates"
run = [
  { task = "fmt:check" },
  { task = "vet" },
  { task = "test" },
  { task = "test:race" },
  { task = "coverage:source" },
  { task = "coverage:encodings" },
]

[tasks.bench]
description = "Run corpus-scale public API benchmarks"
run = '''
corpus="${CORPUS:-{{vars.corpus}}}"
benchtime="${BENCHTIME:-{{vars.benchtime}}}"
benchcount="${BENCHCOUNT:-{{vars.benchcount}}}"
MKASM_BENCH_CORPUS="$corpus" go test ./tests/benchmarks \
  -run '^$' -bench . -benchmem -benchtime "$benchtime" -count "$benchcount"
'''

[tasks."bench:micro"]
description = "Run parser hot-path microbenchmarks"
run = '''
benchtime="${BENCHTIME:-{{vars.benchtime}}}"
benchcount="${BENCHCOUNT:-{{vars.benchcount}}}"
go test ./pkg/arm -run '^$' \
  -bench '^Benchmark(ParseIForm|ParseAsmTemplate|PseudocodeParser|TarCorpusPreparedIFormLookup)$' \
  -benchmem -benchtime "$benchtime" -count "$benchcount"
'''

[tasks."bench:rust-decoder"]
description = "Benchmark generated Rust decode time and allocations"
run = [
  { task = "generate:rust" },
  '''
out="${OUT:-./output-rs}"
iterations="${ITERATIONS:-1000000}"
(cd "$out" && cargo run --release --quiet --example decode_bench -- "$iterations")
''',
]

[tasks."bench:x86"]
description = "Benchmark allocation-free x86 decoding and encoding"
run = '''
corpus="${X86_CORPUS:?set X86_CORPUS to an opcodesDB v3 .json.xz file}"
benchtime="${BENCHTIME:-{{vars.benchtime}}}"
benchcount="${BENCHCOUNT:-{{vars.benchcount}}}"
MKASM_X86_OPCODESDB="$corpus" go test ./pkg/x86 -run '^$' \
  -bench '^Benchmark(DecodeCorpus|Encode)$' -benchmem \
  -benchtime "$benchtime" -count "$benchcount"
'''

[tasks."bench:x86-rust"]
description = "Benchmark the generated x86 Rust decoder"
run = [
  { task = "generate:x86-rust" },
  '''
out="${OUT:-./output-x86-rs}"
iterations="${ITERATIONS:-1000000}"
(cd "$out" && cargo run --release --quiet --example decode_bench -- "$iterations")
''',
]

[tasks."generate:go"]
description = "Generate and test the standalone Go project"
run = '''
corpus="${CORPUS:-{{vars.corpus}}}"
out="${OUT:-./output}"
go run ./cmd/mkasm --codegen go --output "$out" "$corpus"
(cd "$out" && go test ./...)
'''

[tasks."generate:rust"]
description = "Generate and test the standalone Rust crate"
run = '''
corpus="${CORPUS:-{{vars.corpus}}}"
out="${OUT:-./output-rs}"
go run ./cmd/mkasm --codegen rust --output "$out" "$corpus"
(cd "$out" && RUSTFLAGS="-D warnings" cargo test)
'''

[tasks."generate:x86-rust"]
description = "Generate and test the standalone x86 Rust crate"
run = '''
corpus="${X86_CORPUS:?set X86_CORPUS to an opcodesDB v3 .json.xz file}"
out="${OUT:-./output-x86-rs}"
xz -dc "$corpus" | go run ./cmd/mkasm --arch x86_64 --codegen rust --output "$out" -
(cd "$out" && RUSTFLAGS="-D warnings" cargo test)
'''

[tasks.build]
description = "Build and package mkasm for the current platform"
run = '''
version="${VERSION:-$(git describe --tags --always --dirty 2>/dev/null || echo dev)}"
goos="$(go env GOOS)"
goarch="$(go env GOARCH)"
artifact_version="$(printf '%s' "$version" | tr '/ ' '--')"
package="mkasm_${artifact_version}_${goos}_${goarch}"
mkdir -p dist
go build -trimpath -ldflags "-s -w -X main.version=$version" \
  -o dist/mkasm ./cmd/mkasm
./dist/mkasm --version
package_dir="$(mktemp -d "${TMPDIR:-/tmp}/mkasm-release.XXXXXX")"
trap 'rm -rf "$package_dir"' EXIT
cp dist/mkasm LICENSE README.md "$package_dir/"
tar -C "$package_dir" -czf "dist/${package}.tar.gz" mkasm LICENSE README.md
if command -v shasum >/dev/null 2>&1; then
  shasum -a 256 "dist/${package}.tar.gz" > "dist/${package}.tar.gz.sha256"
elif command -v sha256sum >/dev/null 2>&1; then
  sha256sum "dist/${package}.tar.gz" > "dist/${package}.tar.gz.sha256"
else
  echo "release: shasum or sha256sum is required" >&2
  exit 1
fi
printf 'release: dist/%s.tar.gz\n' "$package"
'''

[tasks."conformance:go"]
description = "LLVM byte parity for every toolchain-supported Go exact encoder"
run = '''
corpus="${CORPUS:-{{vars.corpus}}}"
MKASM_CORPUS="$corpus" \
MKASM_CLANG="${MKASM_CLANG:-}" MKASM_LLVM_MC="${MKASM_LLVM_MC:-}" \
MKASM_GO_LLVM_CONFORMANCE=1 \
  go test ./tests/conformance \
    -run '^TestGoAssemblerLLVMConformance$' -v -count=1 -timeout 600s
'''

[tasks."conformance:rust"]
description = "LLVM byte parity for toolchain-supported typed and exact Rust encoders"
run = '''
corpus="${CORPUS:-{{vars.corpus}}}"
MKASM_CORPUS="$corpus" \
MKASM_CLANG="${MKASM_CLANG:-}" MKASM_LLVM_MC="${MKASM_LLVM_MC:-}" \
MKASM_RUST_LLVM_CONFORMANCE=1 \
  go test ./tests/conformance \
    -run '^TestRustAssemblerLLVMConformance$' -v -count=1 -timeout 600s
'''

[tasks."conformance:disasm"]
description = "Word-to-text-to-LLVM parity for every toolchain-supported printable encoding"
run = '''
corpus="${CORPUS:-{{vars.corpus}}}"
MKASM_CORPUS="$corpus" MKASM_CLANG="${MKASM_CLANG:-}" MKASM_LLVM_MC="${MKASM_LLVM_MC:-}" \
MKASM_DISASM_LLVM_PARITY=1 \
  go test ./tests/conformance \
    -run '^TestDisasmAssemblesBack$' -v -count=1 -timeout 600s
'''

[tasks.conformance]
description = "Run supported-instruction Go, Rust, and disassembler LLVM parity"
run = [
  { task = "conformance:go" },
  { task = "conformance:rust" },
  { task = "conformance:disasm" },
]

[tasks."conformance:strict:go"]
description = "Require LLVM coverage and exact bytes for every generated Go encoding"
run = "MKASM_LLVM_REQUIRE_ALL=1 mise run conformance:go"

[tasks."conformance:strict:rust"]
description = "Require LLVM coverage and exact bytes for every typed and exact Rust encoding"
run = "MKASM_LLVM_REQUIRE_ALL=1 mise run conformance:rust"

[tasks."conformance:strict:disasm"]
description = "Require LLVM coverage and exact bytes for every printable encoding"
run = "MKASM_DISASM_REQUIRE_ALL=1 mise run conformance:disasm"

[tasks."conformance:strict"]
description = "Run all-opcode LLVM coverage and byte-parity gates"
run = [
  { task = "conformance:strict:go" },
  { task = "conformance:strict:rust" },
  { task = "conformance:strict:disasm" },
]

[tasks."audit:disasm"]
description = "Run the historical threshold report without claiming conformance"
run = "MKASM_DISASM_AUDIT=1 mise run conformance:disasm"

[tasks."conformance:asl"]
description = "Cross-check opcode bits and fields against Arm ASL"
run = '''
corpus="${CORPUS:-{{vars.corpus}}}"
asl="${ASL:-../arm-asl-parser/asl}"
test -f "$asl/arm_instrs.asl"
test -f "$asl/arch_decode.asl"
MKASM_CORPUS="$corpus" \
MKASM_ASL_INSTRS="$asl/arm_instrs.asl" \
MKASM_ASL_DECODE="$asl/arch_decode.asl" \
  go test ./pkg/asl ./tests/conformance \
    -run 'Corpus|Coverage|CrossCheck' -v -count=1
'''

[tasks."release:check"]
description = "Verify source, build mkasm, test generated projects, and run supported LLVM parity"
run = [
  { task = "verify" },
  { task = "build" },
  { task = "generate:go" },
  { task = "generate:rust" },
  { task = "conformance" },
]

[tasks.clean]
description = "Remove generated projects and local coverage output"
run = "rm -rf ./output ./output-rs ./aarch64-go ./aarch64-rs ./dist ./.coverage"
